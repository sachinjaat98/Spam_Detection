stages:
  data_ingestion:
    cmd: python src/data_ingestion.py
    deps:
    - src/data_ingestion.py
    params:
    - data_ingestion.test_size
    outs:
    - data/raw
  data_preprocessing:
    cmd: python src/preprocessing.py
    deps:
    - data/raw
    - src/preprocessing.py
    outs:
    - data/interim
  feature_engineering:
    cmd: python src/feature_engineering.py
    deps:
    - data/interim
    - src/feature_engineering.py
    params:
    - hidden_size
    outs:
    - data/processed
  model_building:
    cmd: python src/BERT_Model.py
    deps:
    - data/processed
    - src/BERT_Model.py
    outs:
    - models/model_bert.pth
  model_evaluation:
    cmd: python src/model_eval.py
    deps:
    - models/model_bert.pth
    - src/model_eval.py
    metrics:
    - evaluation_results/eval_results.json
